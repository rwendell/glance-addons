# Standalone example: Glance + Kissa + Theme Switcher + Enhanced Search.
# Copy theme-switcher.js and search-enhanced.js into ./assets/, and
# kissa.css into ./assets/themes/kissa.css.
#
# With plugin-manager.js, remove custom-css-file and the direct script tags;
# use plugins.jsonc instead:
#   {"name": "theme-switcher", "config": {"colorscheme": "kissa"}}

server:
  assets-path: assets

document:
  head: |
    <script src="/assets/theme-switcher.js"
      data-config='{"colorscheme":"kissa"}'></script>
    <script src="/assets/search-enhanced.js" defer
      data-config='{"directUrls":true,"suggestions":true,"maxSuggestions":8}'></script>

theme:
  disable-picker: true
  custom-css-file: /assets/themes/kissa.css

  # Kissa Macchiato is the server-rendered fallback.
  background-color: 40 17 10
  contrast-multiplier: 1.15
  text-saturation-multiplier: 1.6
  primary-color: 211 50 66
  positive-color: 97 34 58
  negative-color: 0 71 69

pages:
  - name: Home
    columns:
      - size: full
        widgets:
          - type: search
            hide-header: true
            autofocus: true
            search-engine: duckduckgo
