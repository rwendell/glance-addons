name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, asset: glance-plugins-linux-amd64 }
          - { goos: linux, goarch: arm64, asset: glance-plugins-linux-arm64 }
          - { goos: darwin, goarch: amd64, asset: glance-plugins-darwin-amd64 }
          - { goos: darwin, goarch: arm64, asset: glance-plugins-darwin-arm64 }
          - { goos: windows, goarch: amd64, asset: glance-plugins-windows-amd64.exe }
          - { goos: windows, goarch: arm64, asset: glance-plugins-windows-arm64.exe }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" \
            -o dist/${{ matrix.asset }} ./cmd/glance-plugins

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
