# Standalone example: Glance + Kissa + Theme Switcher + Enhanced Search.
# Copy dist/theme-switcher.js and dist/search-enhanced.js into ./assets/,
# and kissa.css into ./assets/themes/kissa.css.
#
# With Plugin Manager, load plugins.json instead of the direct imports.

server:
  assets-path: assets

document:
  head: |
    <script type="module">
      import setupTheme from "/assets/theme-switcher.js";
      import setupSearch from "/assets/search-enhanced.js";
      setupTheme({ colorscheme: "kissa" });
      setupSearch({ directUrls: true, suggestions: true, maxSuggestions: 8 });
    </script>

theme:
  disable-picker: true
  custom-css-file: /assets/themes/kissa.css

  # Kissa Macchiato is the server-rendered fallback.
  background-color: 40 17 10
  contrast-multiplier: 1.15
  text-saturation-multiplier: 1.6
  primary-color: 211 50 66
  positive-color: 97 34 58
  negative-color: 0 71 69

pages:
  - name: Home
    columns:
      - size: full
        widgets:
          - type: search
            hide-header: true
            autofocus: true
            search-engine: duckduckgo
