# Complete example: Glance + Kissa + Theme Switcher + Enhanced Search.
# Copy theme-switcher.js, search-enhanced.js, and kissa.css into ./assets/.

server:
  assets-path: assets

document:
  head: |
    <script src="/assets/theme-switcher.js"
      data-config='{"lightPreset":"kissa-latte","darkPreset":"kissa-macchiato","autoPreset":"kissa-auto","storageKey":"kissa-theme-mode"}'></script>
    <script src="/assets/search-enhanced.js" defer
      data-config='{"directUrls":true,"suggestions":true,"maxSuggestions":8}'></script>

theme:
  # Remove this line if you want the theme picker visible.
  # disable-picker: true

  custom-css-file: /assets/kissa.css

  # Kissa Macchiato is the server-rendered fallback.
  background-color: 40 17 10
  contrast-multiplier: 1.15
  text-saturation-multiplier: 1.6
  primary-color: 211 50 66
  positive-color: 97 34 58
  negative-color: 0 71 69

  presets:
    kissa-macchiato:
      background-color: 40 17 10
      contrast-multiplier: 1.15
      text-saturation-multiplier: 1.6
      primary-color: 211 50 66
      positive-color: 97 34 58
      negative-color: 0 71 69

    kissa-latte:
      light: true
      background-color: 48 20 95
      contrast-multiplier: 1
      text-saturation-multiplier: 1.6
      primary-color: 213 53 43
      positive-color: 146 33 33
      negative-color: 0 44 43

    kissa-auto:
      background-color: 40 17 10
      contrast-multiplier: 1.15
      text-saturation-multiplier: 1.6
      primary-color: 211 50 66
      positive-color: 97 34 58
      negative-color: 0 71 69

pages:
  - name: Home
    columns:
      - size: full
        widgets:
          - type: search
            hide-header: true
            autofocus: true
            search-engine: duckduckgo
